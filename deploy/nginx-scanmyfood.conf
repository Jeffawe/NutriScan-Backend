# ScanMyFood API reverse proxy (goes in /etc/nginx/conf.d/scanmyfood.conf).
# certbot --nginx adds the HTTPS (443) block for this server_name.
#
# Overload behaviour: per-IP rate limits answer 429 instantly instead of queueing, and if the
# API is down/slow nginx returns a JSON error (with CORS headers so the frontend can show it).

limit_req_zone  $binary_remote_addr zone=smf_api:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=smf_image:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=smf_conn:10m;

map $http_origin $smf_cors_origin {
    default                          "";
    "https://scanmyfood.vercel.app"  $http_origin;
    "http://localhost:5173"          $http_origin;
}

upstream scanmyfood_api {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    server_name scanmyfood.129-80-138-126.sslip.io;

    client_max_body_size 10m;          # photo uploads (nginx default is 1 MB)
    limit_conn smf_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (not append) so clients can't spoof their IP for rate limiting
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 50s;

    error_page 429 = @too_many;
    error_page 502 503 504 = @unavailable;

    location /analyze-image/ {
        limit_req zone=smf_image burst=3 nodelay;
        proxy_pass http://scanmyfood_api;
    }

    location / {
        limit_req zone=smf_api burst=20 nodelay;
        proxy_pass http://scanmyfood_api;
    }

    location @too_many {
        default_type application/json;
        add_header Access-Control-Allow-Origin $smf_cors_origin always;
        add_header Retry-After 10 always;
        return 429 '{"error":"Too many requests. Please wait a moment and try again."}';
    }

    location @unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin $smf_cors_origin always;
        add_header Retry-After 30 always;
        return 503 '{"error":"ScanMyFood is busy or restarting. Please try again shortly."}';
    }
}
